<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F1">
<meta name="description" content="Depois do vídeo, conte qual caminho faz sentido para o Instituto. Leva uns 3 minutos.">
<meta property="og:title" content="Proposta do Instituto">
<meta property="og:description" content="Depois do vídeo, conte qual caminho faz sentido para o Instituto. Leva uns 3 minutos.">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<title>Proposta do Instituto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='6' fill='%231C2124'/%3E%3Cpath d='M8 28h24M11 28v-6M17 28v-4M23 28v-9M29 28v-4' fill='none' stroke='%23F2F3F1' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
  /* Prévia da direção D1 "Planejamento" (direcoes-visuais-iniciais.md): gesso, grafite e osso, com a régua como assinatura */
  :root {
    --gesso: #F2F3F1;
    --papel: #FFFFFF;
    --grafite: #1C2124;
    --grafite-forte: #0E1113;
    --chumbo: #535D62;
    --borda: #848D92;
    --traco: #C9CFD2;
    --osso: #E7DFD1;
    --erro: #8E1F24;
    --erro-fundo: #F7E4E3;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --r: 4px;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--gesso); color: var(--grafite); font-family: var(--sans); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  button, input, textarea { font: inherit; }

  .app { min-height: 100%; min-height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; background: var(--gesso); }
  @media (min-width: 600px) { .app { border-inline: 1px solid var(--traco); } }

  /* Barra superior com a régua de progresso: uma marca por pergunta */
  .bar { position: sticky; top: 0; z-index: 5; background: var(--gesso); padding-top: env(safe-area-inset-top, 0px); }
  .bar-row { display: flex; align-items: center; gap: 8px; min-height: 56px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .back { flex: none; width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center; border: 0; border-radius: var(--r); background: transparent; color: var(--grafite); cursor: pointer; }
  .back svg { width: 24px; height: 24px; }
  .brand { font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--grafite); }
  .bar-title { flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .bar-sec { min-width: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-count { flex: none; font-size: 14px; color: var(--chumbo); font-variant-numeric: tabular-nums; }
  .ruler { position: relative; height: 12px; margin-left: var(--gutter-l); margin-right: var(--gutter-r);
    background:
      linear-gradient(var(--chumbo), var(--chumbo)) right bottom / 1px 6px no-repeat,
      repeating-linear-gradient(to right, var(--chumbo) 0 1px, transparent 1px calc(100% / var(--n, 12))) left bottom / 100% 6px no-repeat,
      linear-gradient(var(--traco), var(--traco)) left bottom / 100% 1px no-repeat; }
  .fill { position: absolute; left: 0; bottom: 0; width: 0; height: 3px; background: var(--grafite); }

  /* Conteúdo */
  main { flex: 1; padding-block: 28px 32px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .step { display: grid; gap: 20px; }
  .step.in-fwd { animation: inFwd .22s ease-out; }
  .step.in-back { animation: inBack .22s ease-out; }
  @keyframes inFwd { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes inBack { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  h1 { margin: 0; font-family: var(--serif); font-size: 26px; line-height: 1.2; font-weight: 500; color: var(--grafite); text-wrap: balance; outline: none; }
  h1.display { font-size: 34px; line-height: 1.12; }
  .hint { margin: -10px 0 0; font-size: 15px; color: var(--chumbo); }
  .lead { margin: 0; font-size: 18px; }
  .small { font-size: 15px; color: var(--chumbo); }
  p { margin: 0; }

  /* Boas-vindas: os dois caminhos do vídeo */
  .paths { background: var(--papel); border: 1px solid var(--traco); border-radius: var(--r); }
  .path { display: grid; gap: 4px; padding: 16px; }
  .path + .path { border-top: 1px solid var(--traco); }
  .path-t { font-weight: 700; }
  .path-d { font-size: 15px; color: var(--chumbo); }
  .bridge { padding-left: 12px; border-left: 3px solid var(--borda); font-size: 16px; }
  .resume { background: var(--osso); border-radius: var(--r); padding: 12px 16px; font-size: 16px; }

  /* Opções */
  .opts { display: grid; gap: 8px; }
  .opt { position: relative; display: flex; align-items: flex-start; gap: 12px; min-height: 56px; padding: 15px 16px; background: var(--papel); border: 1px solid var(--borda); border-radius: var(--r); color: var(--grafite); cursor: pointer; }
  .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  .ind { flex: none; width: 22px; height: 22px; margin-top: 1px; display: grid; place-items: center; border: 2px solid var(--borda); border-radius: 50%; background: var(--papel); }
  .opt.multi .ind { border-radius: 3px; }
  .opt-txt { display: grid; gap: 2px; min-width: 0; }
  .opt-t { font-weight: 500; }
  .opt-d { font-size: 15px; color: var(--chumbo); }
  .opt.on { border-color: var(--grafite); box-shadow: inset 0 0 0 1px var(--grafite); background: var(--osso); }
  .opt.on .ind { border-color: var(--grafite); }
  .opt.on:not(.multi) .ind::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--grafite); }
  .opt.multi.on .ind { background: var(--grafite); }
  .opt.multi.on .ind::after { content: ""; width: 6px; height: 11px; margin-top: -2px; border: solid var(--papel); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }
  .opt.focus { outline: 3px solid var(--grafite); outline-offset: 2px; }

  /* Campos */
  .inp { width: 100%; min-height: 50px; padding: 12px 14px; background: var(--papel); border: 1px solid var(--borda); border-radius: var(--r); color: var(--grafite); font-size: 17px; }
  textarea.inp { min-height: 140px; resize: vertical; line-height: 1.45; }
  .inp:focus { outline: 2px solid var(--grafite); outline-offset: 2px; border-color: var(--grafite); }
  .inp::placeholder { color: var(--chumbo); opacity: .85; }

  /* Revisão */
  .rev-sec { display: grid; gap: 8px; }
  .rev-sec h2 { margin: 0; font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--grafite); }
  .rev { background: var(--papel); border: 1px solid var(--traco); border-radius: var(--r); }
  .rev-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; align-items: center; padding: 10px 4px 10px 16px; border-bottom: 1px solid var(--traco); }
  .rev-row:last-child { border-bottom: 0; }
  .rev-q { font-size: 14px; color: var(--chumbo); }
  .rev-a { font-size: 16px; font-weight: 500; white-space: pre-wrap; overflow-wrap: anywhere; }
  .rev-a.empty { color: var(--chumbo); font-weight: 400; font-style: italic; }
  .edit { grid-column: 2; grid-row: 1 / span 2; min-width: 44px; min-height: 44px; padding: 0 12px; border: 0; border-radius: var(--r); background: transparent; color: var(--grafite); font-size: 15px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  /* Final */
  .ok-ic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--osso); color: var(--grafite); }
  .ok-ic svg { width: 28px; height: 28px; }
  .err { background: var(--erro-fundo); color: var(--erro); border-radius: var(--r); padding: 12px 16px; font-size: 15px; font-weight: 700; }
  .copy-ta { min-height: 220px; font-size: 15px; }
  .status { min-height: 1.4em; font-size: 15px; font-weight: 700; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .row .btn { flex: 1 1 200px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  /* Rodapé com ações */
  .foot { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 8px; background: var(--gesso); border-top: 1px solid var(--traco); padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .btn { min-height: 50px; padding: 12px 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r); font-size: 16px; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
  .btn-primary { flex: 1; background: var(--grafite); color: var(--papel); }
  .btn-primary:active { background: var(--grafite-forte); }
  .btn-primary:disabled { background: var(--traco); color: var(--chumbo); cursor: default; }
  .btn-secondary { background: transparent; color: var(--grafite); box-shadow: inset 0 0 0 1.5px var(--grafite); }
  .btn-text { background: transparent; color: var(--chumbo); padding-inline: 12px; }
  .btn:focus-visible, .back:focus-visible, .edit:focus-visible { outline: 3px solid var(--grafite); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .step.in-fwd, .step.in-back { animation: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .fill { transition: width .25s ease-out; }
    .opt { transition: background-color .15s ease-out, border-color .15s ease-out; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="bar-row">
      <button type="button" class="back" id="back" aria-label="Voltar" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="brand" id="brand">Proposta do Instituto</span>
      <div class="bar-title" id="bar-title" hidden>
        <span class="bar-sec" id="bar-sec"></span>
        <span class="bar-count" id="bar-count"></span>
      </div>
    </div>
    <div class="ruler" id="ruler" aria-hidden="true"><div class="fill" id="fill"></div></div>
  </header>
  <main id="main" aria-live="polite"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
(function () {
  /* Para onde vão as respostas. Com os dois vazios, a pessoa manda pelo WhatsApp.
     WEB3FORMS_KEY: chave do web3forms.com; cada envio chega no seu e-mail (a chave pode ficar pública).
     ENDPOINT: URL de um Worker que receba as respostas (não usado aqui). */
  var WEB3FORMS_KEY = 'f34093c5-879f-4e85-8670-3a486124ef95';
  var ENDPOINT = '';
  var WHATSAPP = ''; /* com DDI e DDD, só números (ex.: 5535999990000). Vazio: a pessoa escolhe o contato. */

  /* Opção com descrição: { t: título (é o que fica gravado), d: descrição, k: resumo para o assunto do e-mail } */
  var FORM = [
    { id: 'voce', t: 'Sobre você', qs: [
      { id: 'nome', type: 'text', t: 'Qual é o seu nome?', ph: 'Ex.: Felipe' }
    ]},
    { id: 'caminho', t: 'O caminho', qs: [
      { id: 'caminho', type: 'radio', t: 'Qual caminho faz mais sentido agora?', o: [
        { t: 'Caminho 1: site e landing pages', d: 'Site do Instituto, páginas de vocês dois, landing pages por serviço e contato pelo WhatsApp e formulário, já com a medição básica.', k: 'Caminho 1' },
        { t: 'Caminho 2: site, landing pages e painel', d: 'Tudo do caminho 1, mais o painel que junta anúncios, site e contatos até saber quem agendou e quem compareceu.', k: 'Caminho 2' },
        { t: 'Caminho 2 com o assistente de IA', d: 'O painel e um assistente que responde perguntas sobre os números, sem mexer em campanha nem em orçamento.', k: 'Caminho 2 com IA' },
        { t: 'Ainda não sei', d: 'Prefiro conversar antes de decidir.', k: 'Ainda não sabe' }
      ]},
      { id: 'motivo', type: 'area', t: 'O que pesou nessa escolha?', ph: 'Ex.: ainda não anunciamos, então o painel pode esperar' }
    ]},
    { id: 'anuncios', t: 'Anúncios e contatos', qs: [
      { id: 'anuncios', type: 'check', t: 'Onde vocês anunciam hoje?', o: ['No Google', 'No Instagram ou no Facebook', 'Ainda não anunciamos, mas queremos começar', 'Não pretendemos anunciar'], ex: ['Ainda não anunciamos, mas queremos começar', 'Não pretendemos anunciar'] },
      { id: 'gestor', type: 'radio', t: 'Quem cuida dos anúncios?', o: ['Nós mesmos', 'Uma agência ou um gestor de tráfego', 'Ninguém ainda'] },
      { id: 'atende', type: 'radio', t: 'Quem vai responder quem chamar pelo site?', o: ['Eu respondo', 'Alguém da recepção', 'Cada profissional responde os seus', 'Ainda não definimos'] },
      { id: 'status', type: 'radio', t: 'Essa pessoa conseguiria marcar quem agendou e quem compareceu?', hint: 'É isso que deixa o painel mostrar qual anúncio traz paciente.', o: ['Sim', 'Sim, se for bem simples', 'Não', 'Não sei'] }
    ]},
    { id: 'site', t: 'Para começar o site', qs: [
      { id: 'nome_inst', type: 'text', t: 'Qual vai ser o nome do Instituto?', hint: 'Se ainda não decidiram, é só pular.', ph: 'O nome ou as opções que vocês estão pensando' },
      { id: 'cidade', type: 'text', t: 'Em que cidade e bairro vocês atendem?', ph: 'Cidade e bairro' },
      { id: 'contato', type: 'check', t: 'Como o paciente deve chamar vocês pelo site?', o: ['WhatsApp', 'Formulário no site', 'Telefone', 'Agendamento online'] }
    ]},
    { id: 'proximo', t: 'Próximo passo', qs: [
      { id: 'conversa', type: 'radio', t: 'Podemos marcar uma conversa de uma hora com você e a Dra. Brenda?', o: ['Sim, nesta semana', 'Sim, na próxima semana', 'Prefiro seguir por mensagem'] },
      { id: 'obs', type: 'area', t: 'Ficou alguma dúvida ou algo que a gente não considerou?' }
    ]}
  ];

  var Q = [];
  FORM.forEach(function (s, si) { s.qs.forEach(function (q) { q.sec = s; q.si = si; Q.push(q); }); });
  var TOTAL = Q.length;
  var STEPS = [{ k: 'welcome' }];
  Q.forEach(function (q, i) { STEPS.push({ k: 'q', q: q, i: i }); });
  STEPS.push({ k: 'review' });
  STEPS.push({ k: 'done' });
  var FIRST_Q = 1, REVIEW = STEPS.length - 2, DONE = STEPS.length - 1;

  var KEY = 'proposta-instituto-v1';
  var state = { step: 0, a: {}, mode: '' }; /* mode no final: sent | whatsapp | error */
  var fromReview = false;
  var resumeStep = 0;
  var clearArmed = false;
  var autoTimer = null;

  var main = document.getElementById('main');
  var foot = document.getElementById('foot');
  var backBtn = document.getElementById('back');
  var brand = document.getElementById('brand');
  var barTitle = document.getElementById('bar-title');
  var barSec = document.getElementById('bar-sec');
  var barCount = document.getElementById('bar-count');
  var fill = document.getElementById('fill');
  document.getElementById('ruler').style.setProperty('--n', TOTAL);

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function ot(o) { return typeof o === 'string' ? o : o.t; }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s && typeof s === 'object' && s.a) { state.a = s.a; state.step = Math.min(Math.max(0, s.step | 0), DONE); state.mode = s.mode || ''; }
    } catch (e) {}
    if (state.step === DONE && !state.mode) state.step = REVIEW;
  }

  function answered(q) {
    var a = state.a[q.id];
    if (Array.isArray(a)) return a.length > 0;
    return !!(a && String(a).trim());
  }
  function answerText(q) {
    var a = state.a[q.id];
    if (Array.isArray(a)) return a.join(', ');
    return a ? String(a).trim() : '';
  }
  function firstName() {
    var p = answerText(Q[0]).split(/\s+/).filter(Boolean);
    if (!p.length) return '';
    return /^(dra?\.?|doutora?)$/i.test(p[0]) && p[1] ? p[0] + ' ' + p[1] : p[0];
  }
  function caminhoCurto() {
    var a = state.a.caminho;
    var o = FORM[1].qs[0].o.filter(function (x) { return x.t === a; })[0];
    return o ? o.k : '';
  }
  function texto(plain) {
    var b = plain ? '' : '*';
    var L = [b + 'Proposta do Instituto: respostas' + b, 'Respondido em ' + new Date().toLocaleDateString('pt-BR'), ''];
    FORM.forEach(function (s, si) {
      L.push(b + (si + 1) + '. ' + s.t + b);
      s.qs.forEach(function (q) { L.push('• ' + q.t + '\n   ' + (answerText(q) || '—')); });
      L.push('');
    });
    return L.join('\n').trim();
  }
  function waLink() {
    return 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(texto());
  }

  /* ---------- Telas ---------- */
  function htmlWelcome() {
    var h = '<div class="step">' +
      '<h1 class="display" tabindex="-1">Qual caminho faz sentido para vocês?</h1>' +
      '<p class="lead">Depois de ver o vídeo, responda por aqui. As respostas vão direto para o Gabriel.</p>' +
      '<div class="paths">' +
        '<div class="path"><span class="path-t">Caminho 1: site e landing pages</span>' +
          '<span class="path-d">Site do Instituto, páginas do Dr. Felipe e da Dra. Brenda, landing pages por serviço e contato pelo WhatsApp e formulário, já com a medição básica.</span></div>' +
        '<div class="path"><span class="path-t">Caminho 2: site, landing pages e painel</span>' +
          '<span class="path-d">Tudo do caminho 1, mais um painel que junta Google Ads, anúncios do Instagram e do Facebook, site e contatos, até saber quem agendou e quem compareceu. O assistente de IA entra se vocês quiserem.</span></div>' +
      '</div>' +
      '<p class="bridge">Dá para começar pelo caminho 1 e somar o painel depois.</p>' +
      '<p class="small">São ' + TOTAL + ' perguntas e leva uns 3 minutos. A maioria é só tocar numa opção; dá para pular o que não souber e continuar depois neste aparelho.</p>';
    if (resumeStep) {
      var qi = STEPS[resumeStep].k === 'q' ? STEPS[resumeStep].i + 1 : TOTAL;
      h += '<p class="resume">Você parou na pergunta ' + qi + ' de ' + TOTAL + '.</p>';
    }
    return h + '</div>';
  }
  function htmlQuestion(q) {
    var h = '<div class="step"><h1 id="qh" tabindex="-1">' + esc(q.t) + '</h1>';
    if (q.hint) h += '<p class="hint">' + esc(q.hint) + '</p>';
    if (q.type === 'check') h += '<p class="hint">Marque quantas quiser.</p>';
    var a = state.a[q.id];
    if (q.type === 'radio' || q.type === 'check') {
      var multi = q.type === 'check';
      var sel = multi ? (Array.isArray(a) ? a : []) : [a];
      h += '<div class="opts" role="' + (multi ? 'group' : 'radiogroup') + '" aria-labelledby="qh">';
      q.o.forEach(function (o) {
        var t = ot(o);
        var on = sel.indexOf(t) !== -1;
        h += '<label class="opt' + (multi ? ' multi' : '') + (on ? ' on' : '') + '">' +
          '<input type="' + (multi ? 'checkbox' : 'radio') + '" name="q" value="' + esc(t) + '"' + (on ? ' checked' : '') + '>' +
          '<span class="ind" aria-hidden="true"></span><span class="opt-txt"><span class="opt-t">' + esc(t) + '</span>' +
          (o.d ? '<span class="opt-d">' + esc(o.d) + '</span>' : '') + '</span></label>';
      });
      h += '</div>';
    } else if (q.type === 'text') {
      h += '<input class="inp" id="inp" type="text" autocomplete="off" aria-labelledby="qh" value="' + esc(a || '') + '"' + (q.ph ? ' placeholder="' + esc(q.ph) + '"' : '') + '>';
    } else if (q.type === 'area') {
      h += '<textarea class="inp" id="inp" aria-labelledby="qh"' + (q.ph ? ' placeholder="' + esc(q.ph) + '"' : '') + '>' + esc(a || '') + '</textarea>';
    }
    return h + '</div>';
  }
  function htmlReview() {
    var h = '<div class="step"><h1 tabindex="-1">Confira antes de enviar</h1><p class="hint">Toque em Alterar para mudar uma resposta.</p>';
    FORM.forEach(function (s) {
      h += '<section class="rev-sec"><h2>' + esc(s.t) + '</h2><div class="rev">';
      s.qs.forEach(function (q) {
        var t = answerText(q);
        h += '<div class="rev-row"><span class="rev-q">' + esc(q.t) + '</span>' +
          '<span class="rev-a' + (t ? '' : ' empty') + '">' + (t ? esc(t) : 'Sem resposta') + '</span>' +
          '<button type="button" class="edit" data-q="' + Q.indexOf(q) + '" aria-label="Alterar: ' + esc(q.t) + '">Alterar</button></div>';
      });
      h += '</div></section>';
    });
    h += '<input class="hp" id="hp" type="checkbox" name="botcheck" tabindex="-1" aria-hidden="true">';
    return h + '</div>';
  }
  function htmlDone() {
    var nome = firstName();
    if (state.mode === 'sent') {
      return '<div class="step">' +
        '<div class="ok-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
        '<h1 tabindex="-1">Recebemos sua resposta' + (nome ? ', ' + esc(nome) : '') + '</h1>' +
        '<p class="lead">O Gabriel vai ler com calma e te chama no WhatsApp para combinar a conversa.</p>' +
        '<p>Se quiser guardar uma cópia, toque em Copiar minhas respostas.</p>' +
        '<textarea class="inp copy-ta" id="copy-ta" readonly aria-label="Suas respostas" hidden></textarea>' +
        '<p class="status" id="status" role="status"></p>' +
      '</div>';
    }
    var erro = state.mode === 'error'
      ? '<p class="err">Não deu para enviar daqui agora. Para não perder nada, mande pelo WhatsApp.</p>' : '';
    return '<div class="step">' + erro +
      '<h1 tabindex="-1">Falta só mandar' + (nome ? ', ' + esc(nome) : '') + '</h1>' +
      '<p class="lead">Copie as respostas e cole na conversa com o Gabriel no WhatsApp.</p>' +
      '<div class="row"><button type="button" class="btn btn-primary" id="copy">Copiar respostas</button>' +
      '<a class="btn btn-secondary" id="wa" href="' + esc(waLink()) + '" target="_blank" rel="noopener">Abrir o WhatsApp</a></div>' +
      '<p class="status" id="status" role="status"></p>' +
      '<textarea class="inp copy-ta" id="copy-ta" readonly aria-label="Suas respostas">' + esc(texto()) + '</textarea>' +
    '</div>';
  }

  /* ---------- Barra e rodapé ---------- */
  function renderBar() {
    var st = STEPS[state.step];
    backBtn.hidden = !(state.step > 0 && state.step !== DONE);
    var titled = st.k === 'q' || st.k === 'review';
    brand.hidden = titled;
    barTitle.hidden = !titled;
    var pct = 0;
    if (st.k === 'q') {
      barSec.textContent = st.q.sec.t;
      barCount.textContent = 'Pergunta ' + (st.i + 1) + ' de ' + TOTAL;
      pct = (st.i + 1) / TOTAL * 100;
    } else if (st.k === 'review') {
      barSec.textContent = 'Revisão';
      barCount.textContent = Q.filter(answered).length + ' de ' + TOTAL + ' respondidas';
      pct = 100;
    } else if (st.k === 'done') {
      pct = 100;
    }
    fill.style.width = pct + '%';
  }
  function renderFoot() {
    var st = STEPS[state.step];
    var h = '';
    if (st.k === 'welcome') {
      if (resumeStep) {
        h = '<button type="button" class="btn btn-text" id="clear">' + (clearArmed ? 'Toque de novo para apagar' : 'Começar do zero') + '</button>' +
            '<button type="button" class="btn btn-primary" id="next">Continuar</button>';
      } else {
        h = '<button type="button" class="btn btn-primary" id="next">Começar</button>';
      }
    } else if (st.k === 'q') {
      var ok = answered(st.q);
      h = '<button type="button" class="btn btn-text" id="skip">Pular</button>' +
          '<button type="button" class="btn btn-primary" id="next"' + (ok ? '' : ' disabled') + '>' + (fromReview ? 'Voltar para a revisão' : 'Continuar') + '</button>';
    } else if (st.k === 'review') {
      h = '<button type="button" class="btn btn-primary" id="send">Enviar respostas</button>';
    } else if (st.k === 'done') {
      h = '<button type="button" class="btn btn-text" id="clear">' + (clearArmed ? 'Toque de novo para apagar' : 'Responder de novo') + '</button>';
      if (state.mode === 'sent') h += '<button type="button" class="btn btn-secondary" id="copy" style="flex:1">Copiar minhas respostas</button>';
    }
    foot.innerHTML = h;
    foot.hidden = !h;
  }

  /* ---------- Navegação ---------- */
  function render(dir) {
    clearTimeout(autoTimer);
    var st = STEPS[state.step];
    var h = st.k === 'welcome' ? htmlWelcome() : st.k === 'q' ? htmlQuestion(st.q) : st.k === 'review' ? htmlReview() : htmlDone();
    main.innerHTML = h;
    var step = main.firstElementChild;
    if (dir && step) step.classList.add(dir === 'back' ? 'in-back' : 'in-fwd');
    renderBar();
    renderFoot();
    window.scrollTo(0, 0);
    var inp = document.getElementById('inp');
    if (inp && st.k === 'q') {
      try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); }
    } else {
      var h1 = main.querySelector('h1');
      if (h1) { try { h1.focus({ preventScroll: true }); } catch (e) { h1.focus(); } }
    }
  }
  function go(n, dir, fromPop) {
    n = Math.max(0, Math.min(DONE, n));
    state.step = n;
    clearArmed = false;
    if (n === REVIEW) fromReview = false;
    save();
    if (!fromPop) { try { history.pushState({ step: n }, ''); } catch (e) {} }
    render(dir || 'fwd');
  }
  function next() {
    if (fromReview && STEPS[state.step].k === 'q') { fromReview = false; go(REVIEW, 'fwd'); return; }
    go(state.step + 1, 'fwd');
  }
  window.addEventListener('popstate', function (e) {
    var n = e.state && typeof e.state.step === 'number' ? e.state.step : 0;
    if (state.step === DONE && state.mode === 'sent') { try { history.pushState({ step: DONE }, ''); } catch (err) {} return; }
    fromReview = false;
    go(n, n < state.step ? 'back' : 'fwd', true);
  });

  /* ---------- Envio ---------- */
  function post(url, data, okFn) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(data) })
      .then(function (r) { return r.json().then(function (j) { return r.ok && okFn(j); }, function () { return false; }); })
      .catch(function () { return false; });
  }
  function camposEmail() {
    var o = {};
    Q.forEach(function (q, i) {
      o[(i < 9 ? '0' : '') + (i + 1) + '. ' + q.t] = answerText(q) || '—';
    });
    return o;
  }
  function enviar(btn) {
    if (!WEB3FORMS_KEY && !ENDPOINT) { state.mode = 'whatsapp'; go(DONE); return; }
    var hp = document.getElementById('hp');
    var robo = !!(hp && hp.checked);
    var nome = answerText(Q[0]);
    var cam = caminhoCurto();
    btn.disabled = true;
    btn.textContent = 'Enviando…';
    var envios = [];
    if (WEB3FORMS_KEY) {
      envios.push(post('https://api.web3forms.com/submit', Object.assign({
        access_key: WEB3FORMS_KEY,
        subject: 'Proposta do Instituto: ' + (nome || 'sem nome') + (cam ? ' (' + cam + ')' : ''),
        from_name: 'Proposta do Instituto',
        botcheck: robo
      }, camposEmail()), function (j) { return j.success === true; }));
    }
    if (ENDPOINT) {
      envios.push(post(ENDPOINT, { v: 1, nome: nome, caminho: cam, answers: state.a, text: texto(true), website: robo ? '1' : '' }, function (j) { return j.ok === true; }));
    }
    Promise.all(envios).then(function (res) {
      state.mode = res.some(Boolean) ? 'sent' : 'error';
      go(DONE);
    });
  }
  function copiar() {
    var ta = document.getElementById('copy-ta');
    var st = document.getElementById('status');
    var t = texto();
    if (ta) { ta.value = t; ta.hidden = false; }
    function ok() { if (st) st.textContent = 'Copiado.'; }
    function fail() { if (ta) { ta.focus(); ta.select(); } if (st) st.textContent = 'Não consegui copiar sozinho. O texto está selecionado: use o Copiar do celular.'; }
    try { navigator.clipboard.writeText(t).then(ok, fail); } catch (e) { fail(); }
  }

  /* ---------- Eventos ---------- */
  backBtn.addEventListener('click', function () {
    if (fromReview) { fromReview = false; go(REVIEW, 'back'); return; }
    go(state.step - 1, 'back');
  });
  foot.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.id === 'next') {
      if (STEPS[state.step].k === 'welcome' && resumeStep) {
        var r = resumeStep;
        resumeStep = 0;
        go(r, 'fwd');
        return;
      }
      next();
    } else if (b.id === 'skip') {
      next();
    } else if (b.id === 'send') {
      enviar(b);
    } else if (b.id === 'copy') {
      copiar();
    } else if (b.id === 'clear') {
      if (!clearArmed) { clearArmed = true; renderFoot(); return; }
      state = { step: 0, a: {}, mode: '' };
      resumeStep = 0;
      clearArmed = false;
      fromReview = false;
      save();
      go(FIRST_Q, 'fwd');
    }
  });
  main.addEventListener('change', function (e) {
    var st = STEPS[state.step];
    if (st.k !== 'q') return;
    var q = st.q;
    if (q.type === 'radio' && e.target.name === 'q') {
      state.a[q.id] = e.target.value;
      main.querySelectorAll('.opt').forEach(function (l) { l.classList.toggle('on', l.querySelector('input').checked); });
      save();
      renderFoot();
      clearTimeout(autoTimer);
      autoTimer = setTimeout(next, 320);
    } else if (q.type === 'check' && e.target.name === 'q') {
      /* "Ainda não anunciamos" e "Não pretendemos" não combinam com as outras opções */
      if (e.target.checked && q.ex) {
        var exclusiva = q.ex.indexOf(e.target.value) !== -1;
        main.querySelectorAll('input[name="q"]').forEach(function (i) {
          if (i !== e.target && (exclusiva || q.ex.indexOf(i.value) !== -1)) i.checked = false;
        });
      }
      state.a[q.id] = Array.prototype.filter.call(main.querySelectorAll('input[name="q"]'), function (i) { return i.checked; }).map(function (i) { return i.value; });
      main.querySelectorAll('.opt').forEach(function (l) { l.classList.toggle('on', l.querySelector('input').checked); });
      save();
      renderFoot();
    }
  });
  main.addEventListener('input', function (e) {
    var st = STEPS[state.step];
    if (st.k !== 'q' || e.target.id !== 'inp') return;
    state.a[st.q.id] = e.target.value;
    save();
    var nb = document.getElementById('next');
    if (nb) nb.disabled = !answered(st.q);
  });
  main.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'inp' && e.target.tagName === 'INPUT') {
      e.preventDefault();
      if (answered(STEPS[state.step].q)) next();
    }
  });
  main.addEventListener('focusin', function (e) {
    var l = e.target.closest && e.target.closest('.opt');
    if (l) l.classList.toggle('focus', e.target.matches(':focus-visible'));
  });
  main.addEventListener('focusout', function (e) {
    var l = e.target.closest && e.target.closest('.opt');
    if (l) l.classList.remove('focus');
  });
  main.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'copy') {
      copiar();
    } else if (b.classList.contains('edit')) {
      fromReview = true;
      state.step = FIRST_Q + (+b.dataset.q);
      save();
      try { history.pushState({ step: state.step }, ''); } catch (err) {}
      render('back');
    }
  });

  /* ---------- Início ---------- */
  load();
  if (state.step !== DONE) {
    /* Quem já tinha começado vê as boas-vindas com "Continuar" */
    if (state.step > FIRST_Q) resumeStep = state.step;
    state.step = 0;
  }
  try { history.replaceState({ step: state.step }, ''); } catch (e) {}
  render();
})();
</script>
</body>
</html>
