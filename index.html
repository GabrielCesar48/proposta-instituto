<style>
  /* Estilo Apple, a pedido do cliente: fonte do sistema (SF Pro no iPhone e no Mac, Inter nos outros),
     listas agrupadas como nos Ajustes do iOS e o monitor do exame em preto, como as páginas de produto.
     Quando a Dra. Brenda responde, a página veste a marca dela: vinho, areia e a serifada itálica do Instagram. */
  :root {
    --fundo: #F2F2F7;
    --cartao: #FFFFFF;
    --texto: #1D1D1F;
    --texto-2: #6E6E73;
    --linha: #C6C6C8;
    --borda: #86868B;
    --azul: #0071E3;
    --azul-escuro: #0058B0;
    --azul-texto: #0066CC;
    --azul-claro: #E8F1FC;
    --verde: #34C759;
    --cinza-botao: #E5E5EA;
    --erro: #D70015;
    --erro-fundo: #FFF0F0;
    --barra: rgba(242, 242, 247, .84);
    --foco: rgba(0, 113, 227, .25);
    --foco-anel: rgba(0, 113, 227, .5);
    --monitor: #000000;
    --palco-centro: #1C1C1E;
    --hud: #F5F5F7;
    --hud-2: #86868B;
    --regua: #636366;
    --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --sf-titulo: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif-marca: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --r: 12px;
    --gutter-l: max(16px, env(safe-area-inset-left, 0px));
    --gutter-r: max(16px, env(safe-area-inset-right, 0px));
    color-scheme: light;
  }
  html[data-tema="brenda"] {
    --fundo: #F3ECE5;
    --cartao: #FFFDFB;
    --texto: #17100C;
    --texto-2: #6E5A4F;
    --linha: #E4D6CA;
    --borda: #9B8576;
    --azul: #5C0819;
    --azul-escuro: #3F0511;
    --azul-texto: #5C0819;
    --azul-claro: #F2E3E0;
    --verde: #5C0819;
    --cinza-botao: #E8DDD3;
    --barra: rgba(243, 236, 229, .86);
    --foco: rgba(92, 8, 25, .22);
    --foco-anel: rgba(92, 8, 25, .45);
    --monitor: #2A040C;
    --palco-centro: #6B0F22;
    --hud: #F3ECE5;
    --hud-2: #D9C3B4;
    --regua: #9C6A70;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font-family: var(--sf); font-size: 17px; line-height: 1.47; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  button, input, textarea { font: inherit; letter-spacing: inherit; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Celular primeiro: o monitor do exame fica em cima e as perguntas embaixo; a partir de 960px, lado a lado */
  .tela { --palco-h: clamp(250px, 40svh, 380px); }
  body.digitando .tela { --palco-h: clamp(150px, 24svh, 230px); }
  .app { min-height: calc(100svh - var(--palco-h)); display: flex; flex-direction: column; max-width: 600px; margin: 0 auto; background: var(--fundo); overflow-x: clip; }

  /* Monitor do exame: o dente (dente.js) para o Dr. Felipe, o mapeamento facial (rosto.js) para a Dra. Brenda */
  .palco { position: relative; height: var(--palco-h); overflow: hidden; isolation: isolate; color: var(--hud); background: radial-gradient(70% 60% at 45% 48%, var(--palco-centro) 0%, var(--monitor) 72%); }
  .palco-3d, .palco-rosto { position: absolute; inset: 0; opacity: 0; }
  .palco-3d canvas, .palco-rosto canvas { display: block; width: 100%; height: 100%; }
  .palco.pronto .palco-3d { opacity: 1; }
  .palco[data-mundo="rosto"] .palco-3d, .palco[data-mundo="rosto"] .palco-svg { opacity: 0; }
  .palco[data-mundo="rosto"].rosto-pronto .palco-rosto { opacity: 1; }
  .palco-svg { position: absolute; left: 50%; top: 53%; height: 74%; transform: translate(-50%, -50%); color: var(--hud-2); opacity: .45; }
  .palco.pronto .palco-svg { opacity: 0; }
  .hud { position: absolute; left: var(--gutter-l); top: 16px; z-index: 2; display: grid; gap: 2px; max-width: 62%; pointer-events: none; }
  .hud-camada { margin: 0; font-family: var(--sf-titulo); font-size: 22px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; color: var(--hud); }
  .hud-prof { margin: 0; font-size: 14px; color: var(--hud-2); font-variant-numeric: tabular-nums; }
  .hud p, .regua-prop { text-shadow: 0 0 2px var(--monitor), 0 1px 10px var(--monitor); }

  /* Régua: milímetros do dente ou terços do rosto */
  .regua { position: absolute; right: var(--gutter-r); top: 17%; bottom: 11%; width: 30px; z-index: 2; pointer-events: none; }
  .regua-escala { position: absolute; right: 0; top: 0; bottom: 0; width: 8px;
    background:
      linear-gradient(var(--regua), var(--regua)) right top / 1px 100% no-repeat,
      linear-gradient(var(--regua), var(--regua)) right bottom / 8px 1px no-repeat,
      repeating-linear-gradient(to bottom, var(--regua) 0 1px, transparent 1px calc(100% / var(--mm, 21.6))) right top / 5px 100% no-repeat; }
  .regua-trecho { position: absolute; right: 14px; width: 2px; border-radius: 1px; background: var(--hud-2); opacity: .7; }
  .regua-coroa { top: 0; height: calc(var(--coroa, 35%) - 3px); }
  .regua-raiz { top: calc(var(--coroa, 35%) + 3px); bottom: 0; }
  .regua-t1, .regua-t2, .regua-t3 { display: none; }
  .palco[data-mundo="rosto"] .regua-coroa, .palco[data-mundo="rosto"] .regua-raiz { display: none; }
  .palco[data-mundo="rosto"] .regua-t1, .palco[data-mundo="rosto"] .regua-t2, .palco[data-mundo="rosto"] .regua-t3 { display: block; }
  .regua-t1 { top: 0; height: calc(var(--t1, 33%) - 3px); }
  .regua-t2 { top: calc(var(--t1, 33%) + 3px); height: calc(var(--t2, 66%) - var(--t1, 33%) - 6px); }
  .regua-t3 { top: calc(var(--t2, 66%) + 3px); bottom: 0; }
  .regua-prop { position: absolute; right: 12px; top: 50%; width: max-content; max-width: 132px; margin: 0; transform: translateY(-50%); text-align: right; font-size: 12px; line-height: 1.35; color: var(--hud-2); opacity: 0; }
  .regua-prop b { display: block; font-size: 13px; font-weight: 600; color: var(--hud); }
  .palco[data-estado="welcome"] .regua-prop, .palco[data-estado="done"] .regua-prop { opacity: 1; }
  .regua-marcador { position: absolute; right: -3px; top: 0; width: 26px; height: 2px; border-radius: 1px; background: var(--hud); opacity: 0; }
  .palco[data-estado="q"] .regua-marcador { opacity: 1; }
  .palco-rotulos { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .rotulo { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px; border-radius: 999px; background: rgba(28, 28, 30, .88); font-size: 12px; font-weight: 600; color: var(--hud); white-space: nowrap; opacity: 0; }
  html[data-tema="brenda"] .rotulo { background: rgba(42, 4, 12, .86); }
  .rotulo::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--hud); }
  .rotulo.esq { flex-direction: row-reverse; padding: 3px 4px 3px 10px; }
  .palco[data-estado="review"] .rotulo { opacity: 1; }
  .palco[data-mundo="rosto"] .rotulo:not(.rotulo-rosto), .palco:not([data-mundo="rosto"]) .rotulo-rosto { display: none; }
  .palco-flash { position: absolute; inset: 0; z-index: 3; background: #FFFFFF; opacity: 0; pointer-events: none; }
  .palco.trocando .palco-flash { animation: troca .8s ease-out; }
  @keyframes troca { 0% { opacity: 0; } 18% { opacity: .9; } 100% { opacity: 0; } }

  /* Barra de navegação translúcida, como no iOS */
  .bar { position: sticky; top: 0; z-index: 5; background: var(--barra); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); padding-top: env(safe-area-inset-top, 0px); }
  .bar-row { display: grid; grid-template-columns: minmax(64px, 1fr) auto minmax(64px, 1fr); align-items: center; min-height: 52px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .back { grid-column: 1; grid-row: 1; justify-self: start; width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--azul-texto); cursor: pointer; }
  .back svg { width: 26px; height: 26px; }
  .bar-title { display: contents; }
  .brand, .bar-sec { grid-column: 2; grid-row: 1; min-width: 0; font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-count { grid-column: 3; grid-row: 1; justify-self: end; font-size: 15px; color: var(--texto-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ruler { height: 3px; margin: 0 var(--gutter-r) 0 var(--gutter-l); border-radius: 2px; background: var(--cinza-botao); overflow: hidden; }
  .fill { width: 0; height: 100%; border-radius: 2px; background: var(--azul); }

  /* Conteúdo */
  main { flex: 1; padding-block: 24px 32px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .step { display: grid; gap: 20px; }
  .step.in-fwd { animation: inFwd .24s ease-out; }
  .step.in-back { animation: inBack .24s ease-out; }
  @keyframes inFwd { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes inBack { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
  h1 { margin: 0; font-family: var(--sf-titulo); font-size: 28px; line-height: 1.14; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; outline: none; }
  h1.display { font-size: 34px; line-height: 1.1; letter-spacing: -0.025em; }
  html[data-tema="brenda"] h1.display, html[data-tema="brenda"] .hud-camada, html[data-tema="brenda"] .rev-sec h2 { font-family: var(--serif-marca); font-style: italic; font-weight: 600; letter-spacing: 0; }
  html[data-tema="brenda"] h1.display { font-size: 40px; line-height: 1.05; }
  html[data-tema="brenda"] .hud-camada { font-size: 26px; }
  html[data-tema="brenda"] .rev-sec h2 { font-size: 24px; }
  .hint { margin: -10px 0 0; font-size: 15px; line-height: 1.4; color: var(--texto-2); overflow-wrap: anywhere; }
  .lead { margin: 0; font-size: 19px; line-height: 1.4; }
  .small { font-size: 15px; line-height: 1.4; color: var(--texto-2); }
  p { margin: 0; }

  /* Boas-vindas no formato da tela de novidades do iOS */
  .destaques { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 20px; }
  .destaques li { display: grid; grid-template-columns: 32px minmax(0, 1fr); column-gap: 14px; align-items: start; }
  .destaques svg { width: 30px; height: 30px; margin-top: 1px; color: var(--azul); }
  .destaques b { display: block; font-size: 17px; font-weight: 600; }
  .destaques span { display: block; font-size: 15px; line-height: 1.4; color: var(--texto-2); }
  .resume { background: var(--azul-claro); border-radius: var(--r); padding: 12px 16px; font-size: 15px; }

  /* Opções em lista agrupada, como nos Ajustes */
  .opts { display: grid; background: var(--cartao); border-radius: var(--r); overflow: hidden; }
  .opt { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 13px 16px; color: var(--texto); cursor: pointer; }
  .opt + .opt::before, .rev-row + .rev-row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--linha); transform: scaleY(.5); transform-origin: top; }
  .opt input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  .opt-txt { flex: 1; display: grid; gap: 2px; min-width: 0; }
  .opt-d { font-size: 14px; line-height: 1.38; color: var(--texto-2); }
  .ind { order: 2; flex: none; width: 22px; height: 22px; display: grid; place-items: center; color: var(--azul); }
  .opt:not(.multi) .ind::after { content: ""; width: 7px; height: 13px; margin-top: -3px; border: solid currentColor; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); opacity: 0; }
  .opt.on:not(.multi) .ind::after { opacity: 1; }
  .opt.multi .ind { border: 1.5px solid var(--borda); border-radius: 50%; }
  .opt.multi.on .ind { background: var(--azul); border-color: var(--azul); }
  .opt.multi.on .ind::after { content: ""; width: 5px; height: 10px; margin-top: -2px; border: solid #FFFFFF; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .opt:active { background: var(--cinza-botao); }
  .opt.focus { outline: 3px solid var(--azul); outline-offset: -3px; }
  .av { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #FFFFFF; font-size: 16px; font-weight: 600; letter-spacing: .02em; }
  .av-felipe { background: #1D1D1F; font-family: var(--sf-titulo); }
  .av-brenda { background: #5C0819; font-family: var(--serif-marca); font-style: italic; font-size: 21px; }
  .fluxo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; line-height: 1.3; }
  .fluxo-l { color: var(--texto-2); }
  .fluxo-i { padding: 4px 10px; border-radius: 999px; background: var(--fundo); }
  .fluxo-seta { flex: none; width: 14px; height: 14px; color: var(--texto-2); }
  .fluxo-par { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }

  /* Campos, no padrão dos formulários do site da Apple */
  .inp { width: 100%; min-height: 50px; padding: 13px 16px; background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--r); color: var(--texto); font-size: 17px; }
  textarea.inp { min-height: 140px; resize: vertical; line-height: 1.45; }
  .inp:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px var(--foco); }
  .inp::placeholder { color: var(--texto-2); opacity: 1; }

  /* Revisão */
  .rev-sec { display: grid; gap: 8px; }
  .rev-sec h2 { margin: 6px 0 0; font-family: var(--sf-titulo); font-size: 20px; font-weight: 700; letter-spacing: -0.015em; }
  .rev { background: var(--cartao); border-radius: var(--r); overflow: hidden; }
  .rev-row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; align-items: center; padding: 11px 4px 11px 16px; }
  .rev-q { font-size: 13px; color: var(--texto-2); }
  .rev-a { font-size: 17px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .rev-a.empty { color: var(--texto-2); }
  .edit { grid-column: 2; grid-row: 1 / span 2; min-width: 44px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--azul-texto); font-size: 17px; cursor: pointer; }

  /* Final */
  .ok-ic { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--verde); color: #FFFFFF; }
  .ok-ic svg { width: 32px; height: 32px; }
  .err { background: var(--erro-fundo); color: var(--erro); border-radius: var(--r); padding: 12px 16px; font-size: 15px; font-weight: 600; }
  .copy-ta { min-height: 220px; font-size: 15px; }
  .status { min-height: 1.4em; font-size: 15px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .row .btn { flex: 1 1 200px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  /* Rodapé translúcido com as ações */
  .foot { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 8px; background: var(--barra); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .btn { min-height: 50px; padding: 12px 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r); font-size: 17px; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; }
  .btn-primary { flex: 1; background: var(--azul); color: #FFFFFF; }
  .btn-primary:active { background: var(--azul-escuro); }
  .btn-primary:disabled { background: var(--cinza-botao); color: #8E8E93; cursor: default; }
  .btn-secondary { background: var(--cartao); color: var(--azul-texto); }
  .btn-text { background: transparent; color: var(--azul-texto); padding-inline: 12px; font-weight: 400; }
  .btn:focus-visible, .back:focus-visible, .edit:focus-visible { outline: 3px solid var(--foco-anel); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .step.in-fwd, .step.in-back, .palco.trocando .palco-flash { animation: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    body, .app, .bar, .foot, .opts, .rev, .btn-primary { transition: background-color .5s ease, color .5s ease; }
    .fill { transition: width .25s ease-out, background-color .5s ease; }
    .opt { transition: background-color .15s ease-out; }
    .palco { transition: height .3s ease-out; }
    .palco-3d, .palco-rosto { transition: opacity .6s ease-out; }
    .palco-svg, .regua-prop, .rotulo { transition: opacity .4s ease-out; }
    .regua-marcador { transition: top 1.15s cubic-bezier(.65, 0, .35, 1), opacity .3s; }
  }

  /* Computador: monitor fixo à esquerda, perguntas à direita */
  @media (min-width: 960px) {
    .tela { --palco-h: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(440px, 600px); }
    body.digitando .tela { --palco-h: 100dvh; }
    .palco { position: sticky; top: 0; }
    .app { min-height: 100dvh; max-width: none; margin: 0; }
    main { padding-left: 32px; padding-right: 32px; }
    .bar-row { padding-left: 32px; padding-right: 32px; }
    .ruler { margin-left: 32px; margin-right: 32px; }
    .foot { padding-left: 32px; padding-right: 32px; }
    .hud { left: 40px; top: 36px; }
    .hud-camada { font-size: 32px; }
    html[data-tema="brenda"] .hud-camada { font-size: 38px; }
    .hud-prof { font-size: 16px; }
    .regua { right: 40px; top: 15%; bottom: 13%; }
    .regua-prop { max-width: 190px; font-size: 13px; }
    .regua-prop b { font-size: 15px; }
    .rotulo { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="tela">
<section class="palco" id="palco" data-estado="welcome" data-mundo="dente" aria-hidden="true">

    DONE = STEPS.length - 1;

    state.step = Math.min(state.step, DONE);
    if (state.step === DONE && !state.mode) state.step = REVIEW;

    painel: '<path d="M5 19.5V13M10 19.5V6.5M15 19.5V10M20 19.5V4.5"/>',
    tempo: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>',
    corte: '<path d="M12 3.5l8.5 4.5-8.5 4.5L3.5 8z"/><path d="M3.5 12.5l8.5 4.5 8.5-4.5"/><path d="M3.5 16.5l8.5 4.5 8.5-4.5"/>'
  };
  function destaque(icone, titulo, texto) {
    return '<li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONES[icone] + '</svg>' +
      '<div><b>' + titulo + '</b><span>' + texto + '</span></div></li>';
  }
  function htmlWelcome() {
    var p = pessoa();
    var maior = Math.max(perguntasDe('felipe').length, perguntasDe('brenda').length);
    var h = '<div class="step">' +
      '<h1 class="display" tabindex="-1">Qual proposta faz sentido para vocês?</h1>' +
      '<p class="lead">Depois de ver o vídeo, responda por aqui. Cada um responde a sua parte, e as respostas vão direto para o Gabriel.</p>' +
      '<ul class="destaques">' +
        destaque('site', 'Proposta 1: site e landing pages', 'Site do Instituto e um subdomínio para cada profissional, com a página e as landing pages de cada um, e contato pelo WhatsApp e pelo formulário.') +
        destaque('painel', 'Proposta 2: site, landing pages e painel', 'Tudo da proposta 1, mais um painel que mostra todo dia os números do Google Ads e do Meta Ads, e um agente de IA que responde sobre as campanhas pelo Telegram ou pelo WhatsApp. Os dois só leem os dados.') +
        destaque('tempo', 'Uns 12 minutos, sem reunião', 'Cerca de ' + maior + ' perguntas, quase todas de tocar numa opção. Com elas o projeto já começa.') +
        destaque('corte', p === 'brenda' ? 'Uma camada a cada resposta' : 'Um corte a cada resposta',
          p === 'brenda' ? 'O planejamento facial acompanha o questionário, camada por camada.' : 'O exame acompanha o questionário: o dente para o Dr.&nbsp;Felipe e o planejamento facial para a Dra.&nbsp;Brenda.') +
      '</ul>' +
      '<p class="small">Dá para começar pela proposta 1 e somar o painel depois. Se precisar parar, as respostas ficam guardadas neste aparelho.</p>';
    if (resumeStep) {
      var qi = STEPS[resumeStep].k === 'q' ? STEPS[resumeStep].i + 1 : TOTAL;
      h += '<p class="resume">Você parou na pergunta ' + qi + ' de ' + TOTAL + '.</p>';
    }
    return h + '</div>';
  }
  function htmlFluxo(f) {
    var seta = '<svg class="fluxo-seta" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M9 4.5L12.5 8 9 11.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="sr"> leva para </span>';
    /* a seta fica presa ao passo seguinte, para nunca sobrar sozinha numa linha */
    return '<span class="fluxo"><span class="fluxo-l">Exemplo:</span><span class="fluxo-i">' + esc(f[0]) + '</span>' +
      f.slice(1).map(function (x) { return '<span class="fluxo-par">' + seta + '<span class="fluxo-i">' + esc(x) + '</span></span>'; }).join('') + '</span>';
  }
  function htmlQuestion(q) {
    var h = '<div class="step"><h1 id="qh" tabindex="-1">' + esc(q.t) + '</h1>';
    if (q.hint) h += '<p class="hint">' + esc(q.hint) + '</p>';
    else if (q.type === 'check') h += '<p class="hint">Marque quantas quiser.</p>';
    var a = state.a[q.id];
    if (q.type === 'radio' || q.type === 'check') {
      var multi = q.type === 'check';
      var sel = multi ? (Array.isArray(a) ? a : []) : [a];
      h += '<div class="opts" role="' + (multi ? 'group' : 'radiogroup') + '" aria-labelledby="qh">';
      q.o.forEach(function (o) {
        var t = ot(o);
        var on = sel.indexOf(t) !== -1;
        h += '<label class="opt' + (multi ? ' multi' : '') + (on ? ' on' : '') + '">' +
          '<input type="' + (multi ? 'checkbox' : 'radio') + '" name="q" value="' + esc(t) + '"' + (on ? ' checked' : '') + '>' +
          (o.av ? '<span class="av av-' + (o.av === 'BS' ? 'brenda' : 'felipe') + '" aria-hidden="true">' + esc(o.av) + '</span>' : '') +
          '<span class="ind" aria-hidden="true"></span><span class="opt-txt"><span class="opt-t">' + esc(t) + '</span>' +
          (o.d ? '<span class="opt-d">' + esc(o.d) + '</span>' : '') +
          (o.fluxo ? htmlFluxo(o.fluxo) : '') + '</span></label>';
      });
      h += '</div>';
    } else if (q.type === 'text') {
      h += '<input class="inp" id="inp" type="text" autocomplete="off" aria-labelledby="qh" value="' + esc(a || '') + '"' + (q.ph ? ' placeholder="' + esc(q.ph) + '"' : '') + (q.im ? ' inputmode="' + q.im + '"' : '') + '>';
    } else if (q.type === 'area') {
      h += '<textarea class="inp" id="inp" aria-labelledby="qh"' + (q.ph ? ' placeholder="' + esc(q.ph) + '"' : '') + '>' + esc(a || '') + '</textarea>';
    }
    return h + '</div>';
  }
  function htmlReview() {
    var h = '<div class="step"><h1 tabindex="-1">Confira antes de enviar</h1><p class="hint">Toque em Alterar para mudar uma resposta.</p>';
    FORM.forEach(function (s) {
      var qs = Q.filter(function (q) { return q.sec === s; });
      if (!qs.length) return;
      h += '<section class="rev-sec"><h2>' + esc(s.t) + '</h2><div class="rev">';
      qs.forEach(function (q) {
        var t = answerText(q);
        h += '<div class="rev-row"><span class="rev-q">' + esc(q.t) + '</span>' +
          '<span class="rev-a' + (t ? '' : ' empty') + '">' + (t ? esc(t) : 'Sem resposta') + '</span>' +
          '<button type="button" class="edit" data-q="' + Q.indexOf(q) + '" aria-label="Alterar: ' + esc(q.t) + '">Alterar</button></div>';
      });
      h += '</div></section>';
    });
    h += '<input class="hp" id="hp" type="checkbox" name="botcheck" tabindex="-1" aria-hidden="true">';
    return h + '</div>';
  }
  function htmlDone() {
    var nome = firstName();
    if (state.mode === 'sent') {
      return '<div class="step">' +
        '<div class="ok-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
        '<h1 tabindex="-1">Recebemos sua resposta' + (nome ? ', ' + esc(nome) : '') + '</h1>' +
        '<p class="lead">O Gabriel vai ler tudo e manda o próximo passo pelo WhatsApp.</p>' +
        '<p class="small">Se quiser guardar uma cópia, toque em Copiar minhas respostas.</p>' +
        '<textarea class="inp copy-ta" id="copy-ta" readonly aria-label="Suas respostas" hidden></textarea>' +
        '<p class="status" id="status" role="status"></p>' +
      '</div>';
    }
    var erro = state.mode === 'error'
      ? '<p class="err">Não deu para enviar daqui agora. Para não perder nada, mande pelo WhatsApp.</p>' : '';
    return '<div class="step">' + erro +
      '<h1 tabindex="-1">Falta só mandar' + (nome ? ', ' + esc(nome) : '') + '</h1>' +
      '<p class="lead">Copie as respostas e cole na conversa com o Gabriel no WhatsApp.</p>' +
      '<div class="row"><button type="button" class="btn btn-primary" id="copy">Copiar respostas</button>' +
      '<a class="btn btn-secondary" id="wa" href="' + esc(waLink()) + '" target="_blank" rel="noopener">Abrir o WhatsApp</a></div>' +
      '<p class="status" id="status" role="status"></p>' +
      '<textarea class="inp copy-ta" id="copy-ta" readonly aria-label="Suas respostas">' + esc(texto()) + '</textarea>' +
    '</div>';
  }

  /* ---------- Barra e rodapé ---------- */
  function renderBar() {
    var st = STEPS[state.step];
    backBtn.hidden = !(state.step > 0 && state.step !== DONE);
    var titled = st.k === 'q' || st.k === 'review';
    brand.hidden = titled;
    barTitle.hidden = !titled;
    var pct = 0;
    if (st.k === 'q') {
      barSec.textContent = st.q.sec.t;
      barCount.textContent = (st.i + 1) + ' de ' + TOTAL;
      pct = (st.i + 1) / TOTAL * 100;
    } else if (st.k === 'review') {
      barSec.textContent = 'Revisão';
      barCount.textContent = Q.filter(answered).length + ' de ' + TOTAL;
      pct = 100;
    } else if (st.k === 'done') {
      pct = 100;
    }
    fill.style.width = pct + '%';
  }
  function renderFoot() {
    var st = STEPS[state.step];
    var h = '';
    if (st.k === 'welcome') {
      if (resumeStep) {
        h = '<button type="button" class="btn btn-text" id="clear">' + (clearArmed ? 'Toque de novo para apagar' : 'Começar do zero') + '</button>' +
            '<button type="button" class="btn btn-primary" id="next">Continuar</button>';
      } else {
        h = '<button type="button" class="btn btn-primary" id="next">Começar</button>';
      }
    } else if (st.k === 'q') {
      var ok = answered(st.q);
      h = (st.q.obrigatoria ? '' : '<button type="button" class="btn btn-text" id="skip">Pular</button>') +
          '<button type="button" class="btn btn-primary" id="next"' + (ok ? '' : ' disabled') + '>' + (fromReview ? 'Voltar para a revisão' : 'Continuar') + '</button>';
    } else if (st.k === 'review') {
      h = '<button type="button" class="btn btn-primary" id="send">Enviar respostas</button>';
    } else if (st.k === 'done') {
      h = '<button type="button" class="btn btn-text" id="clear">' + (clearArmed ? 'Toque de novo para apagar' : 'Responder de novo') + '</button>';
      if (state.mode === 'sent') h += '<button type="button" class="btn btn-secondary" id="copy" style="flex:1">Copiar minhas respostas</button>';
    }
    foot.innerHTML = h;
    foot.hidden = !h;
  }

  /* Tema e palco de quem responde: Apple e o dente para o Dr. Felipe, a marca e o rosto para a Dra. Brenda */
  function aplicarTema() {
    var p = pessoa();
    document.documentElement.setAttribute('data-tema', p || 'instituto');
    if (corTema) corTema.setAttribute('content', p === 'brenda' ? '#2A040C' : '#000000');
    var mundo = p === 'brenda' ? 'rosto' : 'dente';
    var mudou = palco.getAttribute('data-mundo') !== mundo;
    palco.setAttribute('data-mundo', mundo);
    if (mundo === 'rosto' && !window.rosto && !carregandoRosto) {
      carregandoRosto = true;
      import('./rosto.js').catch(function () {});
    }
    return mudou;
  }
  function avisarPalco() {
    var st = STEPS[state.step];
    var e = st.k === 'q' ? { k: 'q', i: st.i, total: TOTAL } : { k: st.k, total: TOTAL };
    palco.setAttribute('data-estado', st.k);
    document.body.classList.toggle('digitando', st.k === 'q' && (st.q.type === 'text' || st.q.type === 'area'));
    var mudou = aplicarTema();
    window.__denteEstado = e;
    var mundo = palco.getAttribute('data-mundo') === 'rosto' ? window.rosto : window.dente;
    if (mundo) {
      try { if (mudou && mundo.ativar) mundo.ativar(e); else mundo.ir(e); } catch (err) {}
    }
    if (mudou) {
      palco.classList.remove('trocando');
      void palco.offsetWidth;
      palco.classList.add('trocando');
    }
  }

  /* ---------- Navegação ---------- */
  function render(dir) {
    clearTimeout(autoTimer);
    var st = STEPS[state.step];
    var h = st.k === 'welcome' ? htmlWelcome() : st.k === 'q' ? htmlQuestion(st.q) : st.k === 'review' ? htmlReview() : htmlDone();
    main.innerHTML = h;
    var step = main.firstElementChild;
    if (dir && step) step.classList.add(dir === 'back' ? 'in-back' : 'in-fwd');
    renderBar();
    renderFoot();
    avisarPalco();
    window.scrollTo(0, 0);
    var inp = document.getElementById('inp');
    if (inp && st.k === 'q') {
      try { inp.focus({ preventScroll: true }); } catch (e) { inp.focus(); }
    } else {
      var h1 = main.querySelector('h1');
      if (h1) { try { h1.focus({ preventScroll: true }); } catch (e) { h1.focus(); } }
    }
  }
  function go(n, dir, fromPop) {
    n = Math.max(0, Math.min(DONE, n));
    state.step = n;
    clearArmed = false;
    if (n === REVIEW) fromReview = false;
    save();
    if (!fromPop) { try { history.pushState({ step: n }, ''); } catch (e) {} }
    render(dir || 'fwd');
  }
  function next() {
    if (fromReview && STEPS[state.step].k === 'q') { fromReview = false; go(REVIEW, 'fwd'); return; }
    go(state.step + 1, 'fwd');
  }
  window.addEventListener('popstate', function (e) {
    var n = e.state && typeof e.state.step === 'number' ? e.state.step : 0;
    if (state.step === DONE && state.mode === 'sent') { try { history.pushState({ step: DONE }, ''); } catch (err) {} return; }
    fromReview = false;
    go(n, n < state.step ? 'back' : 'fwd', true);
  });

  /* ---------- Envio ---------- */
  function post(url, data, okFn) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(data) })
      .then(function (r) { return r.json().then(function (j) { return r.ok && okFn(j); }, function () { return false; }); })
      .catch(function () { return false; });
  }
  function camposEmail() {
    var o = {};
    Q.forEach(function (q, i) {
      o[(i < 9 ? '0' : '') + (i + 1) + '. ' + q.t] = answerText(q) || '—';
    });
    return o;
  }
  function enviar(btn) {
    if (!WEB3FORMS_KEY && !ENDPOINT) { state.mode = 'whatsapp'; go(DONE); return; }
    var hp = document.getElementById('hp');
    var robo = !!(hp && hp.checked);
    var nome = firstName();
    var cam = propostaCurta();
    btn.disabled = true;
    btn.textContent = 'Enviando…';
    var envios = [];
    if (WEB3FORMS_KEY) {
      envios.push(post('https://api.web3forms.com/submit', Object.assign({
        access_key: WEB3FORMS_KEY,
        subject: 'Proposta do Instituto: ' + (nome || 'sem nome') + (cam ? ' (' + cam + ')' : ''),
        from_name: 'Proposta do Instituto',
        botcheck: robo
      }, camposEmail()), function (j) { return j.success === true; }));
    }
    if (ENDPOINT) {
      envios.push(post(ENDPOINT, { v: 4, nome: nome, proposta: cam, answers: state.a, text: texto(true), website: robo ? '1' : '' }, function (j) { return j.ok === true; }));
    }
    Promise.all(envios).then(function (res) {
      state.mode = res.some(Boolean) ? 'sent' : 'error';
      go(DONE);
    });
  }
  function copiar() {
    var ta = document.getElementById('copy-ta');
    var st = document.getElementById('status');
    var t = texto();
    if (ta) { ta.value = t; ta.hidden = false; }
    function ok() { if (st) st.textContent = 'Copiado.'; }
    function fail() { if (ta) { ta.focus(); ta.select(); } if (st) st.textContent = 'Não consegui copiar sozinho. O texto está selecionado: use o Copiar do celular.'; }
    try { navigator.clipboard.writeText(t).then(ok, fail); } catch (e) { fail(); }
  }

  /* ---------- Eventos ---------- */
  backBtn.addEventListener('click', function () {
    if (fromReview) { fromReview = false; go(REVIEW, 'back'); return; }
    go(state.step - 1, 'back');
  });
  foot.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.id === 'next') {
      if (STEPS[state.step].k === 'welcome' && resumeStep) {
        var r = resumeStep;
        resumeStep = 0;
        go(r, 'fwd');
        return;
      }
      next();
    } else if (b.id === 'skip') {
      next();
    } else if (b.id === 'send') {
      enviar(b);
    } else if (b.id === 'copy') {
      copiar();
    } else if (b.id === 'clear') {
      if (!clearArmed) { clearArmed = true; renderFoot(); return; }
      state = { step: 0, a: {}, mode: '' };
      resumeStep = 0;
      clearArmed = false;
      fromReview = false;
      montar();
      save();
      go(FIRST_Q, 'fwd');
    }
  });
  main.addEventListener('change', function (e) {
    var st = STEPS[state.step];
    if (st.k !== 'q') return;
    var q = st.q;
    if (q.type === 'radio' && e.target.name === 'q') {
      state.a[q.id] = e.target.value;
      main.querySelectorAll('.opt').forEach(function (l) { l.classList.toggle('on', l.querySelector('input').checked); });
      if (q.id === 'quem') { montar(); avisarPalco(); }   // troca as perguntas, o tema e o palco na hora
      save();
      renderFoot();
      clearTimeout(autoTimer);
      autoTimer = setTimeout(next, q.id === 'quem' ? 650 : 320);
    } else if (q.type === 'check' && e.target.name === 'q') {
      /* opções como "Ainda não anuncio" não combinam com as outras */
      if (e.target.checked && q.ex) {
        var exclusiva = q.ex.indexOf(e.target.value) !== -1;
        main.querySelectorAll('input[name="q"]').forEach(function (i) {
          if (i !== e.target && (exclusiva || q.ex.indexOf(i.value) !== -1)) i.checked = false;
        });
      }
      state.a[q.id] = Array.prototype.filter.call(main.querySelectorAll('input[name="q"]'), function (i) { return i.checked; }).map(function (i) { return i.value; });
      main.querySelectorAll('.opt').forEach(function (l) { l.classList.toggle('on', l.querySelector('input').checked); });
      save();
      renderFoot();
    }
  });
  main.addEventListener('input', function (e) {
    var st = STEPS[state.step];
    if (st.k !== 'q' || e.target.id !== 'inp') return;
    state.a[st.q.id] = e.target.value;
    save();
    var nb = document.getElementById('next');
    if (nb) nb.disabled = !answered(st.q);
  });
  main.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'inp' && e.target.tagName === 'INPUT') {
      e.preventDefault();
      if (answered(STEPS[state.step].q)) next();
    }
  });
  main.addEventListener('focusin', function (e) {
    var l = e.target.closest && e.target.closest('.opt');
    if (l) l.classList.toggle('focus', e.target.matches(':focus-visible'));
  });
  main.addEventListener('focusout', function (e) {
    var l = e.target.closest && e.target.closest('.opt');
    if (l) l.classList.remove('focus');
  });
  main.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'copy') {
      copiar();
    } else if (b.classList.contains('edit')) {
      fromReview = true;
      state.step = FIRST_Q + (+b.dataset.q);
      save();
      try { history.pushState({ step: state.step }, ''); } catch (err) {}
      render('back');
    }
  });

  /* ---------- Início ---------- */
  load();
  if (state.step !== DONE) {
    /* Quem já tinha começado vê as boas-vindas com "Continuar" */
    if (state.step > FIRST_Q) resumeStep = state.step;
    state.step = 0;
  }
  try { history.replaceState({ step: state.step }, ''); } catch (e) {}
  render();
})();
</script>
<script type="module" src="dente.js"></script>
</body>
</html>
